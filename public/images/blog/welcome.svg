      <text x="188" y="128" fill="#8b93a5">= {</text>
      <text x="82" y="180" fill="#ff8a8a">team</text>
      <text x="160" y="180" fill="#8b93a5">:</text>
      <text x="186" y="180" fill="#e8e8e8">'passionate developers',</text>
