      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMint" cx="0.86" cy="0.88" r="0.6">
      <stop offset="0%" stop-color="#aee8b0" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#aee8b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#aee8b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
