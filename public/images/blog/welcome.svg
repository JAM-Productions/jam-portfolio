      <text x="160" y="284" fill="#8b93a5">:</text>
      <text x="186" y="284" fill="#e8e8e8">'ship it',</text>
      <text x="46" y="336" fill="#8b93a5">}</text>
      <text x="46" y="388" fill="#659a61">&gt;</text>
